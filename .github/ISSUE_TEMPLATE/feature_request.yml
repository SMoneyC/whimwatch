name: Feature idea
description: Suggest something WhimWatch could do better or differently.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Missing a creator? Use the **Add or fix a creator link** form instead. Please don't include
        adult content, explicit page titles or personal details.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem, rather than a specific solution.
      placeholder: When I…, I'd like to…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Screenshots or sketches are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      options:
        - No, just suggesting it
        - Yes, I'd like to open a pull request
        - Maybe, with some pointers
